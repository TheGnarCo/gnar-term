name: CI

on:
  push:
    branches: [main]
  # Run on every pull request regardless of its base branch, so stacked PRs
  # (e.g. base = a feature branch, not main) get CI too. For pull_request
  # events GitHub reads this trigger from the PR's BASE branch, so this must
  # be present on each base branch for its PRs to run.
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vite build
        run: npx vite build

      - name: Rust check
        working-directory: src-tauri
        run: cargo check
