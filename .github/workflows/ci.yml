name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install Rust stable (macOS)
        if: runner.os == 'macOS'
        run: |
          # macos-latest ships Homebrew rustup whose cargo shim shadows the
          # real cargo, and dtolnay/rust-toolchain has been unreliable on
          # this image (PATH update intermittently doesn't apply). Do a
          # clean explicit install instead.
          brew uninstall --ignore-dependencies rustup-init 2>/dev/null || true
          brew uninstall --ignore-dependencies rustup 2>/dev/null || true
          rm -rf "$HOME/.cargo" "$HOME/.rustup"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal \
                --component clippy --component rustfmt --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Sanity check while we still trust this run
          ls -la "$HOME/.cargo/bin"
          "$HOME/.cargo/bin/cargo" --version
          "$HOME/.cargo/bin/rustc" --version

      - name: Install Rust stable (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Prettier check
        run: npx prettier --check src/

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Svelte check
        run: npx svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Tests
        run: npm test

      - name: Coverage
        if: matrix.os == 'macos-latest'
        run: npm test -- --coverage

      - name: Upload coverage report
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Vite build
        run: npx vite build

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --quiet
          cargo audit

      - name: Cargo deny
        working-directory: src-tauri
        run: |
          cargo install cargo-deny --quiet
          cargo deny check
